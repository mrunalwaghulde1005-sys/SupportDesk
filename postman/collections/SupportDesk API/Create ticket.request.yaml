$kind: http-request
url: http://localhost:3000/tickets
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_0qi6}}"
body:
  type: json
  content: |-
    {
      "title": "Login issue",
      "description": "Unable to login to my account",
      "status": "OPEN",
      "priority": "P2",
      "category": "Technical"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('standard response envelope', function () { pm.expect(body).to.have.all.keys('data', 'error', 'meta'); });
      if (pm.response.code === 201 && body.data && body.data.id) {
        pm.collectionVariables.set('ticket_id', body.data.id);
      }
    language: text/javascript
settings:
  disabledSystemHeaders:
    - content-type
order: 2000
