$kind: http-request
description: |-
  {
  "title": "Login issue",
  "description": "Unable to login to my SupportDesk account.",
  "status": "OPEN",
  "priority": "P2",
  "category": "Technical",
  "createdById": 1
  }
url: http://localhost:3000/tickets
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"title\": \"Login issue\",\r

    \  \"description\": \"Unable to login to my SupportDesk account.\",\r

    \  \"status\": \"OPEN\",\r

    \  \"priority\": \"P2\",\r

    \  \"category\": \"Technical\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_1cqp}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('standard response envelope', function () { pm.expect(body).to.have.all.keys('data', 'error', 'meta'); });
      pm.collectionVariables.set('ticketId', body.data.id);
    language: text/javascript
settings:
  disabledSystemHeaders:
    - content-type
order: 2000
